<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TorneoManager Web — Sistema de gestión de ligas y torneos de fútbol amateur">
    <title>TorneoManager — Gestión de Torneos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">⚽</div>
            <span class="brand-text">TorneoManager</span>
        </div>
        <div class="sidebar-menu">
            <a href="#/dashboard" class="menu-item active" data-page="dashboard">
                <span class="menu-icon">📊</span>
                <span class="menu-text">Dashboard</span>
            </a>
            <a href="#/torneos" class="menu-item" data-page="torneos">
                <span class="menu-icon">🏆</span>
                <span class="menu-text">Torneos</span>
            </a>
            <a href="#/equipos" class="menu-item" data-page="equipos">
                <span class="menu-icon">👥</span>
                <span class="menu-text">Equipos</span>
            </a>
            <a href="#/jugadores" class="menu-item" data-page="jugadores">
                <span class="menu-icon">🧑‍🤝‍🧑</span>
                <span class="menu-text">Jugadores</span>
            </a>
            <a href="#/fixture" class="menu-item" data-page="fixture">
                <span class="menu-icon">📅</span>
                <span class="menu-text">Fixture</span>
            </a>
            <a href="#/proximos" class="menu-item" data-page="proximos">
                <span class="menu-icon">⏰</span>
                <span class="menu-text">Próximos Partidos</span>
            </a>
            <a href="#/reportes" class="menu-item" data-page="reportes">
                <span class="menu-icon">📈</span>
                <span class="menu-text">Reportes</span>
            </a>
        </div>
        <div class="sidebar-footer">
            <div class="version-badge">v2.0 Web</div>
        </div>
    </nav>

    <!-- Mobile hamburger -->
    <button class="hamburger" id="hamburger" aria-label="Abrir menú">☰</button>

    <!-- Main content area -->
    <main class="main-content" id="main-content">
        <div class="page-container" id="page-container">
            <!-- Pages are loaded dynamically here -->
        </div>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toast-container"></div>

    <!-- Modal overlay -->
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 class="modal-title" id="modal-title"></h3>
                <button class="modal-close" id="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-footer" id="modal-footer"></div>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/pages/dashboard.js"></script>
    <script src="/js/pages/torneos.js"></script>
    <script src="/js/pages/equipos.js"></script>
    <script src="/js/pages/jugadores.js"></script>
    <script src="/js/pages/fixture.js"></script>
    <script src="/js/pages/proximos.js"></script>
    <script src="/js/pages/reportes.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
